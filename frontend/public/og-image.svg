<?xml version="1.0" encoding="UTF-8"?>
<!--
  ThreatPulse social preview image (1200×630).

  NOTE: this is a placeholder in SVG form. Most social platforms (LinkedIn, X,
  Facebook, Slack) do not render SVG Open Graph images, so this file should be
  replaced with a 1200×630 PNG or JPEG of the same design before launch, and
  the og:image / twitter:image references in index.html updated accordingly.
-->
